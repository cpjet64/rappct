workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - when: never

stages:
  - verify
  - package
  - publish
  - release

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "50"
  GIT_CLEAN_FLAGS: "-ffdx -e target/ -e .cargo-home/ -e book/ -e lcov.info"
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: "never"

verify_windows:
  stage: verify
  tags:
    - windows
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -Command "node scripts/verify-version-surfaces.cjs"
    - powershell -NoProfile -ExecutionPolicy Bypass -Command "just ci-deep"

package_crate:
  stage: package
  tags:
    - windows
  needs:
    - job: verify_windows
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -Command "node scripts/verify-version-surfaces.cjs"
    - powershell -NoProfile -ExecutionPolicy Bypass -Command "cargo package --locked"
  artifacts:
    name: "rappct-$CI_COMMIT_TAG-crate"
    expire_in: 14 days
    paths:
      - target/package/*.crate

publish_crates_io:
  stage: publish
  tags:
    - windows
  needs:
    - job: package_crate
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -Command "if (-not $env:CARGO_REGISTRY_TOKEN) { throw 'CARGO_REGISTRY_TOKEN is required for crates.io publish.' }"
    - powershell -NoProfile -ExecutionPolicy Bypass -Command "cargo publish --locked --token $env:CARGO_REGISTRY_TOKEN"

publish_gitlab_release:
  stage: release
  tags:
    - windows
  needs:
    - job: package_crate
      artifacts: true
    - job: publish_crates_io
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/publish-gitlab-release.ps1
