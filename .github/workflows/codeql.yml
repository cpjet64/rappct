name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '23 10 * * 6'

jobs:
  analyze-actions:
    name: Analyze (actions)
    runs-on: windows-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      
      - name: Initialize CodeQL (actions)
        uses: github/codeql-action/init@c54b30b7df092240050e69945842bc67aee0f0f4 # v4.37.3
        with:
          languages: actions
          build-mode: none
      
      - name: Perform CodeQL Analysis (actions)
        uses: github/codeql-action/analyze@c54b30b7df092240050e69945842bc67aee0f0f4 # v4.37.3
        with:
          category: "/language:actions"

  analyze-rust-windows:
    name: Analyze (rust - windows)
    runs-on: windows-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      
      - name: Initialize CodeQL (rust)
        uses: github/codeql-action/init@c54b30b7df092240050e69945842bc67aee0f0f4 # v4.37.3
        with:
          languages: rust
          build-mode: none
          queries: security-and-quality
      
      - name: Perform CodeQL Analysis (rust)
        uses: github/codeql-action/analyze@c54b30b7df092240050e69945842bc67aee0f0f4 # v4.37.3
        with:
          category: "/language:rust-windows"
