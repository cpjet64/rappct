name: CI

on:
  push:
    branches: [ main, feat/**, fix/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    continue-on-error: ${{ matrix.rust == 'beta' || matrix.rust == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        rust: [ stable, "1.88.0", "1.89.0", "1.90.0", "1.91.0", "1.92.0", "1.93.0", "1.94.0", "1.95.0", beta, nightly ]
        features: ["", "introspection", "net", "introspection,net"]
    env:
      RUST_BACKTRACE: 1
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Cache to speed up Windows builds
      - name: Cache cargo
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          cache-on-failure: true
          save-if: true

      - name: Install Rust (stable)
        if: ${{ matrix.rust == 'stable' }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Install Rust (${{ matrix.rust }})
        if: ${{ matrix.rust != 'stable' && matrix.rust != 'beta' && matrix.rust != 'nightly' }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Install Rust (beta)
        if: ${{ matrix.rust == 'beta' }}
        uses: dtolnay/rust-toolchain@4711ae3e97dd6376c8d5d5d51c89566406abaefa # beta
        with:
          components: clippy

      - name: Install Rust (nightly)
        if: ${{ matrix.rust == 'nightly' }}
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          components: clippy

      - name: Show toolchain
        run: rustc -Vv && cargo -V

      - name: Format check (workspace)
        if: ${{ matrix.rust == 'stable' && matrix.features == '' }}
        run: cargo fmt --all -- --check

      - name: Repository hygiene
        if: ${{ matrix.rust == 'stable' && matrix.features == '' }}
        shell: pwsh
        run: ./scripts/hygiene.ps1

      - name: Code size guard
        if: ${{ matrix.rust == 'stable' && matrix.features == '' }}
        run: python scripts/check_code_size.py

      - name: Test (${{ matrix.features }} | ${{ matrix.rust }})
        shell: pwsh
        run: |
          if ("${{ matrix.features }}" -eq "") {
            cargo test --all-targets --locked
          } else {
            cargo test --all-targets --locked --features "${{ matrix.features }}"
          }

      - name: Dependency Duplicates (cargo tree -d)
        if: ${{ matrix.rust == 'stable' }}
        shell: bash
        run: |
          if [[ "${{ matrix.features }}" == "" ]]; then
            cargo tree -d --locked
          else
            cargo tree -d --locked --features "${{ matrix.features }}"
          fi

      - name: Clippy (${{ matrix.features }} | ${{ matrix.rust }})
        shell: pwsh
        run: |
          if ("${{ matrix.features }}" -eq "") {
            cargo clippy --all-targets --locked -- -D warnings
          } else {
            cargo clippy --all-targets --locked --features "${{ matrix.features }}" -- -D warnings
          }
